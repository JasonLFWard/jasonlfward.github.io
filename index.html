    const { useState, useEffect, useRef } = React;
    const DESKTOP_GRID = { originX: 15, originY: 15, cellWidth: 90, cellHeight: 84, iconWidth: 84, iconHeight: 80 };
    const imageCache = new Map();

    const preloadImage = (url) => {
      if (!url || imageCache.has(url)) return imageCache.get(url);
      const image = new Image();
      image.decoding = 'async';
      image.src = url;
      imageCache.set(url, image);
      return image;
    };

    const playXpSound = (type) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();

        if (type === 'click') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.04);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + 0.04);
        } else if (type === 'error') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(160, ctx.currentTime);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + 0.25);
        } else if (type === 'recycle') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(400, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 0.18);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + 0.18);
        } else if (type === 'notify') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + 0.25);
        }
      } catch(e) {}
    };

    const normalizeDesktopIcons = (icons = {}) => {
      const normalized = {};
      Object.entries(icons).forEach(([id, position]) => {
        const requestedColumn = Math.max(0, Math.round(((position?.x ?? DESKTOP_GRID.originX) - DESKTOP_GRID.originX) / DESKTOP_GRID.cellWidth));
        const requestedRow = Math.max(0, Math.round(((position?.y ?? DESKTOP_GRID.originY) - DESKTOP_GRID.originY) / DESKTOP_GRID.cellHeight));
        let column = requestedColumn;
        let row = requestedRow;
        while (Object.values(normalized).some(existing => existing.x === DESKTOP_GRID.originX + column * DESKTOP_GRID.cellWidth && existing.y === DESKTOP_GRID.originY + row * DESKTOP_GRID.cellHeight)) {
          row += 1;
          if (row > 7) { row = 0; column += 1; }
        }
        normalized[id] = { x: DESKTOP_GRID.originX + column * DESKTOP_GRID.cellWidth, y: DESKTOP_GRID.originY + row * DESKTOP_GRID.cellHeight };
      });
      return normalized;
    };

        bgWindow = '#d4d0c8';
        taskbarBg = '#d4d0c8';
        startBtnBg = '#d4d0c8';
        if (sub === 'marine') {
          primaryColor = '#004040';
          titleGradient = 'linear-gradient(to right, #004040 0%, #008080 100%)';
        } else if (sub === 'plum') {
          primaryColor = '#400040';
          titleGradient = 'linear-gradient(to right, #400040 0%, #800080 100%)';
        } else if (sub === 'charcoal') {
          primaryColor = '#222222';
          titleGradient = 'linear-gradient(to right, #222222 0%, #555555 100%)';
        } else {
          primaryColor = '#000080';
          titleGradient = 'linear-gradient(to right, #000080 0%, #1084d0 100%)';
        }
      } else if (os === 'w98') {
        bgWindow = '#c0c0c0';
        taskbarBg = '#c0c0c0';
        startBtnBg = '#c0c0c0';
        if (sub === 'brick') {
          primaryColor = '#800000';
          titleGradient = 'linear-gradient(to right, #800000 0%, #e04040 100%)';
        } else if (sub === 'highcontrast') {
          primaryColor = '#000000';
          titleGradient = '#000000';
          titleText = '#ffff00';
        } else {
          primaryColor = '#000080';
          titleGradient = 'linear-gradient(to right, #000080 0%, #1084d0 100%)';
        }
      }

      return `
        :root {
          --xp-bg: ${bgWindow};
          --xp-blue: ${primaryColor};
          --xp-title-gradient: ${titleGradient};
          --xp-title-text: ${titleText};
          --xp-taskbar: ${taskbarBg};
          --xp-start-btn: ${startBtnBg};
        }
      `;
    };

    function XpMenuBar({ winId, activeMenu, setActiveMenu, menuConfig = [] }) {
      return (
        <div className="xp-menu-bar" onClick={(e) => e.stopPropagation()}>
          <div className="flex gap-0.5">
            {menuConfig.map((menu) => {
              const isOpen = activeMenu?.winId === winId && activeMenu?.menu === menu.title;
              return (
                <div
                  key={menu.title}
                  className={`xp-menu-item select-none text-xs ${isOpen ? 'active' : ''}`}
                  onClick={(e) => {
                    e.stopPropagation();
                    setActiveMenu(isOpen ? null : { winId, menu: menu.title });
                  }}
                  onMouseEnter={() => {
                    if (activeMenu?.winId === winId) {
                      setActiveMenu({ winId, menu: menu.title });
                    }
                  }}
                >
                  <span>{menu.title}</span>
                  {isOpen && (
                    <div className="xp-menu-dropdown shadow-lg">
                      {menu.items.map((item, idx) => {
                        if (item.separator) {
                          return <div key={`sep-${idx}`} className="xp-menu-separator" />;
                        }
                        return (
                          <div
                            key={item.label || idx}
                            className={`xp-menu-dropdown-item flex justify-between items-center ${item.disabled ? 'opacity-40 cursor-not-allowed' : ''}`}
                            onClick={(e) => {
                              e.stopPropagation();
                              if (item.disabled) return;
                              setActiveMenu(null);
                              if (item.action) item.action();
                            }}
                          >
                            <span className="flex items-center gap-2">
                              <span className="w-4 text-center">{item.icon || ''}</span>
                              <span className={item.bold ? 'font-bold' : ''}>{item.label}</span>
                            </span>
                            {item.shortcut && (
                              <span className="text-[10px] text-slate-400 font-mono ml-4">{item.shortcut}</span>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function XpDialogModal({ modal, onClose }) {
      if (!modal || !modal.isOpen) return null;
      return (
        <div className="xp-dialog-overlay" onClick={onClose}>
          <div className="xp-dialog-box" onClick={(e) => e.stopPropagation()}>
            <div className="xp-titlebar flex justify-between items-center">
              <span className="flex items-center gap-1.5 truncate">
                {modal.icon || 'ℹ️'} {modal.title || 'Information'}
              </span>
              <div className="xp-controls">
                <button className="close" onClick={onClose}>X</button>
              </div>
            </div>
            <div className="p-4 bg-white text-xs text-slate-800 space-y-3">
              <div className="flex gap-3 items-start">
                <span className="text-3xl">{modal.icon || '💻'}</span>
                <div className="flex-1 space-y-1.5">
                  <div className="font-bold text-sm text-slate-900">{modal.title}</div>
                  <div className="text-slate-700 leading-relaxed whitespace-pre-wrap">{modal.message}</div>
                  {modal.details && (
                    <div className="p-2 bg-slate-50 border rounded font-mono text-[11px] text-slate-600">
                      {modal.details}
                    </div>
                  )}
                </div>
              </div>
              <div className="flex justify-end pt-2 border-t border-slate-200">
                <button
                  onClick={onClose}
                  className="px-5 py-1 bg-[#ece9d8] hover:bg-[#dedad0] active:bg-[#cbc6ba] border-2 border-white rounded shadow-sm text-xs font-bold"
                  autoFocus
                >
                  OK
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [data, setData] = useState(() => JSON.parse(JSON.stringify(DEFAULT_DATA)));

      const [firebaseUser, setFirebaseUser] = useState(null);
      const [isSyncing, setIsSyncing] = useState(false);
      const [imageManifest, setImageManifest] = useState([]);

      const [isAdminUnlocked, setIsAdminUnlocked] = useState(false);
      const [adminPasswordInput, setAdminPasswordInput] = useState('');
      const [adminAuthError, setAdminAuthError] = useState('');

      const [selectedWindowId, setSelectedWindowId] = useState('win-1');
      const [selectedIconId, setSelectedIconId] = useState(null);
      const [selectedPhotoIds, setSelectedPhotoIds] = useState({});
      const [myComputerTab, setMyComputerTab] = useState('control');
      const [adminTab, setAdminTab] = useState('sections');
      const [selectedAdminWinId, setSelectedAdminWinId] = useState('win-1');

      const [viewerState, setViewerState] = useState({
        isOpen: false,
        isMinimized: false,
        isMaximized: false,
        x: 100, y: 40, width: 860, height: 580,
        zIndex: 200,
        photos: [],
        currentIndex: 0,
        title: '',
        zoom: 100,
        rotation: 0,
        flipH: false,
        flipV: false,
        filter: 'none',
        isPaintOpen: false,
        activeTool: 'pencil',
        brushColor: '#ff0000',
        brushSize: 3,
        isSlideshow: false
      });

      const [activeMenu, setActiveMenu] = useState(null);
      const [dialogModal, setDialogModal] = useState({ isOpen: false, title: '', icon: 'ℹ️', message: '', details: '' });
      const [textDocFontSizes, setTextDocFontSizes] = useState({});

      const [highestZIndex, setHighestZIndex] = useState(120);
      const [sysTime, setSysTime] = useState('');
      const [isStartOpen, setIsStartOpen] = useState(false);
      const [showShutdownModal, setShowShutdownModal] = useState(false);

      useEffect(() => {
        FEATURED_PHOTOS.forEach(photo => preloadImage(photo.url));
        fetch('images.json')
          .then(response => response.ok ? response.json() : [])
          .then(images => {
            const manifest = Array.isArray(images) ? images : [];
            setImageManifest(manifest);
            [...FEATURED_PHOTOS, ...manifest].forEach(photo => preloadImage(photo.url));
          })
          .catch(() => setImageManifest([]));
      }, []);

      useEffect(() => {
        data.windows.flatMap(window => window.photos || []).forEach(photo => preloadImage(photo.url));
      }, [data.windows]);

      useEffect(() => {
        if (imageManifest.length === 0) return;
        setData(prev => {
          const featured = prev.windows.find(w => w.id === 'win-1');
          if (!featured) return prev;
          const existingUrls = new Set((featured.photos || []).map(photo => photo.url));
          const newPhotos = imageManifest.filter(photo => !existingUrls.has(photo.url));
          if (newPhotos.length === 0) return prev;
          return {
            ...prev,
            windows: prev.windows.map(w => w.id === 'win-1' ? { ...w, photos: [...(w.photos || []), ...newPhotos] } : w)
          };
        });
      }, [imageManifest]);

      const [contextMenu, setContextMenu] = useState({
        visible: false,
        type: 'photo',
        x: 0, y: 0, photo: null, sourceWinId: null
      });

      const [recycleConfirmItem, setRecycleConfirmItem] = useState(null);

      const [draggingWin, setDraggingWin] = useState(null);
      const [resizingWin, setResizingWin] = useState(null);
      const [draggingIconId, setDraggingIconId] = useState(null);
      const dragStartPos = useRef({ x: 0, y: 0, winX: 0, winY: 0, winW: 0, winH: 0, iconX: 0, iconY: 0 });
      const lastPointerPosition = useRef({ x: 0, y: 0 });

      const directAddFileInputRef = useRef(null);
      const currentUploadingWinId = useRef(null);

      useEffect(() => {
        const FB = window.FirebaseBridge;
        if (!FB || !FB.firebaseConfig) return;

        try {
          const app = FB.initializeApp(FB.firebaseConfig);
          const auth = FB.getAuth(app);
          const db = FB.getFirestore(app);

          const authenticateAndSubscribe = async () => {
            try {
              if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await FB.signInWithCustomToken(auth, __initial_auth_token);
              } else {
                await FB.signInAnonymously(auth);
              }
            } catch (authErr) {
              console.warn("Firebase Auth fallback:", authErr);
            }

            FB.onAuthStateChanged(auth, (user) => {
              if (!user) return;
              setFirebaseUser(user);

              const docRef = FB.doc(db, 'artifacts', FB.appId, 'public', 'data');

              FB.onSnapshot(docRef, () => {}, (err) => {
                console.warn("Firestore Snapshot error:", err);
              });
            });
          };

          authenticateAndSubscribe();
        } catch(e) {
          console.warn("Firebase initialization skipped:", e);
        }
      }, []);

      useEffect(() => {
        const FB = window.FirebaseBridge;
        if (FB && firebaseUser) {
          setIsSyncing(true);
          try {
            const app = FB.initializeApp(FB.firebaseConfig);
            const db = FB.getFirestore(app);
            const docRef = FB.doc(db, 'artifacts', FB.appId, 'public', 'data');
            FB.setDoc(docRef, data).then(() => setIsSyncing(false)).catch(() => setIsSyncing(false));
          } catch(e) {
            setIsSyncing(false);
          }
        }
      }, [data, firebaseUser]);

      useEffect(() => {
        const updateTime = () => {
          const now = new Date();
          let h = now.getHours();
          let m = now.getMinutes();
          const ampm = h >= 12 ? 'PM' : 'AM';
          h = h % 12 || 12;
          m = m < 10 ? '0' + m : m;
          setSysTime(`${h}:${m} ${ampm}`);
        };
        updateTime();
        const interval = setInterval(updateTime, 1000);
        return () => clearInterval(interval);
      }, []);

      const updateSettings = (key, value) => {
        setData(prev => ({ ...prev, settings: { ...prev.settings, [key]: value } }));
      };

      const handleOSThemeChange = (newOsId) => {
        const selectedTheme = OS_THEMES.find(t => t.id === newOsId);
        if (!selectedTheme) return;
        if (data.settings.enableSounds) playXpSound('click');

        const rememberedBg = data.settings.themeWallpapers?.[newOsId] || selectedTheme.defaultBg;

        setData(prev => ({
          ...prev,
          settings: {
            ...prev.settings,
            osTheme: newOsId,
            subScheme: selectedTheme.subSchemes[0].id,
            desktopBg: rememberedBg
          }
        }));
      };

      const setWallpaperForCurrentTheme = (newBg) => {
        const currentOs = data.settings.osTheme || 'xp';
        setData(prev => ({
          ...prev,
          settings: {
            ...prev.settings,
            desktopBg: newBg,
            themeWallpapers: {
              ...(prev.settings.themeWallpapers || {}),
              [currentOs]: newBg
            }
          }
        }));
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        const currentPass = data.settings.adminPassword || 'admin';
        if (adminPasswordInput === currentPass) {
          setIsAdminUnlocked(true);
          setAdminAuthError('');
          if (data.settings.enableSounds) playXpSound('notify');
        } else {
          setAdminAuthError('Incorrect Password.');
          if (data.settings.enableSounds) playXpSound('error');
        }
      };

      const paintCanvasRef = useRef(null);
      const paintUndoStack = useRef([]);
      const paintRedoStack = useRef([]);
      const isPaintingRef = useRef(false);
      const paintStartPosRef = useRef({ x: 0, y: 0 });
      const paintSnapshotRef = useRef(null);

      const getTopZIndex = () => {
        const winZs = (data.windows || []).map(w => w.zIndex || 0);
        const currentHighest = Math.max(highestZIndex, ...winZs, viewerState.zIndex || 0, 100);
        const nextZ = currentHighest + 1;
        setHighestZIndex(nextZ);
        return nextZ;
      };

      const updateWindow = (id, updates) => {
        setData(prev => ({
          ...prev,
          windows: prev.windows.map(w => w.id === id ? { ...w, ...updates } : w)
        }));
      };

      const bringToFront = (id) => {
        const nextZ = getTopZIndex();
        updateWindow(id, { zIndex: nextZ, isMinimized: false });
        setSelectedWindowId(id);
      };

      const toggleMinimize = (id) => {
        if (data.settings.enableSounds) playXpSound('click');
        const win = data.windows.find(w => w.id === id);
        if (!win) return;
        updateWindow(id, { isMinimized: !win.isMinimized });
      };

      const toggleMaximize = (id) => {
        if (data.settings.enableSounds) playXpSound('click');
        const win = data.windows.find(w => w.id === id);
        if (!win) return;
        updateWindow(id, { isMaximized: !win.isMaximized });
      };

      const closeWindow = (id) => {
        if (data.settings.enableSounds) playXpSound('click');
        updateWindow(id, { isOpen: false });
      };

      const openWindow = (id) => {
        if (data.settings.enableSounds) playXpSound('click');
        setContextMenu(prev => ({ ...prev, visible: false }));
        const nextZ = getTopZIndex();
        setSelectedWindowId(id);
        setData(prev => {
          let exists = prev.windows.some(w => w.id === id);
          let nextWindows = prev.windows;

          if (!exists) {
            if (id === 'sys-computer') {
              nextWindows = [...prev.windows, {
                id: "sys-computer", title: "My Computer & Control Panel", type: "system",
                x: 100, y: 60, width: 620, height: 460, isOpen: true, isMinimized: false, zIndex: nextZ
              }];
            } else if (id === 'sys-recyclebin') {
              nextWindows = [...prev.windows, {
                id: "sys-recyclebin", title: "Recycle Bin", type: "system",
                x: 140, y: 100, width: 480, height: 320, isOpen: true, isMinimized: false, zIndex: nextZ
              }];
            }
          } else {
            nextWindows = prev.windows.map(w => w.id === id ? { ...w, isOpen: true, isMinimized: false, zIndex: nextZ } : w);
          }

          return { ...prev, windows: nextWindows };
        });
      };

      const addWindow = (type = 'folder') => {
        if (data.settings.enableSounds) playXpSound('click');
        setContextMenu(prev => ({ ...prev, visible: false }));
        const newId = `win-${Date.now()}`;
        const isText = type === 'txt';
        const nextZ = getTopZIndex();
        
        const nextIconPosition = getFreeDesktopPosition(data.desktopIcons, newId, DESKTOP_GRID.originX, DESKTOP_GRID.originY);

        const newWin = {
          id: newId,
          title: isText ? "New Document.txt" : "New Photo Gallery",
          type: isText ? "txt" : "folder",
          x: 90, y: 70, width: isText ? 480 : 580, height: isText ? 340 : 440,
          layout: isText ? "text" : "grid",
          thumbnailSize: isText ? undefined : "medium",
          defaultViewMode: isText ? "large" : "grid",
          viewMode: isText ? "large" : "grid",
          isOpen: true, isMinimized: false, zIndex: nextZ,
          content: isText ? "Enter text document content..." : "",
          photos: []
        };

        setData(prev => ({
          ...prev,
          desktopIcons: { ...(prev.desktopIcons || {}), [newId]: nextIconPosition },
          windows: [...prev.windows, newWin]
        }));
        setSelectedAdminWinId(newId);
        setSelectedWindowId(newId);
      };

      const confirmMoveToRecycleBin = (win) => {
        setRecycleConfirmItem(win);
        if (data.settings.enableSounds) playXpSound('error');
      };

      const executeRecycleBinMove = () => {
        if (!recycleConfirmItem) return;
        const item = recycleConfirmItem;
        if (data.settings.enableSounds) playXpSound('recycle');

        setData(prev => {
          const nextIcons = { ...prev.desktopIcons };
          delete nextIcons[item.id];
          return {
            ...prev,
            desktopIcons: nextIcons,
            recycleBin: [...(prev.recycleBin || []), item],
            windows: prev.windows.filter(w => w.id !== item.id)
          };
        });
        setRecycleConfirmItem(null);
      };

      const triggerDirectPhotoUpload = (winId) => {
        currentUploadingWinId.current = winId;
        if (directAddFileInputRef.current) {
          directAddFileInputRef.current.click();
        }
      };

      const handleDirectPhotoFileSelect = (e) => {
        const file = e.target.files[0];
        const winId = currentUploadingWinId.current;
        if (!file || !winId) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width; let height = img.height;
            const maxDim = 1000;

            if (width > height && width > maxDim) {
              height *= maxDim / width; width = maxDim;
            } else if (height > maxDim) {
              width *= maxDim / height; height = maxDim;
            }

            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            
            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.65);
            const fileNameClean = file.name.replace(/\.[^/.]+$/, "");

            const win = data.windows.find(w => w.id === winId);
            if (!win) return;

            const newPhotoObj = {
              id: `p-${Date.now()}`,
              url: compressedBase64,
              caption: fileNameClean,
              date: new Date().toISOString().split('T')[0],
              size: `${(file.size / (1024 * 1024)).toFixed(1)} MB`
            };

            updateWindow(winId, { photos: [...(win.photos || []), newPhotoObj] });
            if (data.settings.enableSounds) playXpSound('notify');
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
        e.target.value = '';
      };

      const deletePhotoFromAdminWin = (winId, photoId) => {
        const win = data.windows.find(w => w.id === winId);
        if (!win || !win.photos) return;
        updateWindow(winId, { photos: win.photos.filter(p => p.id !== photoId) });
      };

      const updatePhotoInAdminWin = (winId, photoId, key, value) => {
        const win = data.windows.find(w => w.id === winId);
        if (!win || !win.photos) return;
        const newPhotos = win.photos.map(p => p.id === photoId ? { ...p, [key]: value } : p);
        updateWindow(winId, { photos: newPhotos });
      };

      const handleImageUpload = (e, winId, photoId) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width; let height = img.height;
            const maxDim = 1000;

            if (width > height && width > maxDim) {
              height *= maxDim / width; width = maxDim;
            } else if (height > maxDim) {
              width *= maxDim / height; height = maxDim;
            }

            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            
            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.65);
            updatePhotoInAdminWin(winId, photoId, 'url', compressedBase64);
            updatePhotoInAdminWin(winId, photoId, 'size', `${(file.size / (1024 * 1024)).toFixed(1)} MB`);
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      const openPhotoViewer = (photos, index, windowTitle = 'Photo Gallery') => {
        if (!photos || photos.length === 0) return;
        if (data.settings.enableSounds) playXpSound('click');
        const nextZ = getTopZIndex();
        setViewerState(prevVs => ({
          ...prevVs,
          isOpen: true,
          isMinimized: false,
          zIndex: nextZ,
          photos,
          currentIndex: index,
          title: windowTitle,
          rotation: 0,
          flipH: false,
          flipV: false,
          filter: 'none',
          zoom: 100,
          isSlideshow: false
        }));
        paintUndoStack.current = [];
        paintRedoStack.current = [];
        if (paintCanvasRef.current) {
          const ctx = paintCanvasRef.current.getContext('2d');
          ctx.clearRect(0, 0, paintCanvasRef.current.width, paintCanvasRef.current.height);
        }
      };
      const openPaint = () => {
        if (data.settings.enableSounds) playXpSound('click');
        setContextMenu(prev => ({ ...prev, visible: false }));
        const nextZ = getTopZIndex();
        setViewerState(prev => ({
          ...prev,
          isOpen: true,
          isMinimized: false,
          isPaintOpen: true,
          zIndex: nextZ,
          photos: [],
          currentIndex: 0,
          title: 'MS Paint',
          rotation: 0,
          flipH: false,
          flipV: false,
          filter: 'none',
          zoom: 100,
          isSlideshow: false
        }));
        paintUndoStack.current = [];
        paintRedoStack.current = [];
      };

      const bringViewerToFront = () => {
        const nextZ = getTopZIndex();
        setViewerState(vs => ({ ...vs, zIndex: nextZ, isMinimized: false }));
      };

      const getCanvasCoords = (e) => {
        const canvas = paintCanvasRef.current;
        if (!canvas) return { x: 0, y: 0 };
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        return {
          x: (e.clientX - rect.left) * scaleX,
          y: (e.clientY - rect.top) * scaleY
        };
      };

      const startPaint = (e) => {
        e.preventDefault(); e.stopPropagation();
        const canvas = paintCanvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const { x, y } = getCanvasCoords(e);
        paintStartPosRef.current = { x, y };

        if (viewerState.activeTool === 'text') {
          const txt = prompt("Enter text to stamp onto photo:", "Jason Ward Photography");
          if (txt) {
            ctx.save();
            ctx.font = `bold ${Math.max(16, viewerState.brushSize * 6)}px Tahoma, sans-serif`;
            ctx.fillStyle = viewerState.brushColor;
            ctx.shadowColor = "rgba(0,0,0,0.8)";
            ctx.shadowBlur = 4;
            ctx.fillText(txt, x, y);
            ctx.restore();
            savePaintSnapshot();
            if (data.settings.enableSounds) playXpSound('notify');
          }
          return;
        }

        isPaintingRef.current = true;
        paintSnapshotRef.current = ctx.getImageData(0, 0, canvas.width, canvas.height);

        ctx.lineWidth = viewerState.brushSize;
        ctx.strokeStyle = viewerState.brushColor;
        ctx.fillStyle = viewerState.brushColor;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        if (viewerState.activeTool === 'eraser') {
          ctx.globalCompositeOperation = 'destination-out';
          ctx.lineWidth = viewerState.brushSize * 3;
        } else if (viewerState.activeTool === 'brush') {
          ctx.globalCompositeOperation = 'source-over';
          ctx.lineWidth = viewerState.brushSize * 2.5;
        } else {
          ctx.globalCompositeOperation = 'source-over';
        }

        if (viewerState.activeTool === 'pencil' || viewerState.activeTool === 'brush' || viewerState.activeTool === 'eraser') {
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x, y);
          ctx.stroke();
        }
      };

      const doPaint = (e) => {
        if (!isPaintingRef.current) return;
        const canvas = paintCanvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const { x, y } = getCanvasCoords(e);
        const start = paintStartPosRef.current;

        if (viewerState.activeTool === 'pencil' || viewerState.activeTool === 'brush' || viewerState.activeTool === 'eraser') {
          ctx.lineTo(x, y);
          ctx.stroke();
        } else if (['line', 'rect', 'circle', 'arrow'].includes(viewerState.activeTool)) {
          if (paintSnapshotRef.current) {
            ctx.putImageData(paintSnapshotRef.current, 0, 0);
          }
          ctx.beginPath();
          ctx.lineWidth = viewerState.brushSize;
          ctx.strokeStyle = viewerState.brushColor;
          ctx.fillStyle = viewerState.brushColor;
          ctx.lineCap = 'round';

          if (viewerState.activeTool === 'line') {
            ctx.moveTo(start.x, start.y);
            ctx.lineTo(x, y);
            ctx.stroke();
          } else if (viewerState.activeTool === 'rect') {
            ctx.strokeRect(start.x, start.y, x - start.x, y - start.y);
          } else if (viewerState.activeTool === 'circle') {
            const rx = Math.abs(x - start.x) / 2;
            const ry = Math.abs(y - start.y) / 2;
            const cx = Math.min(start.x, x) + rx;
            const cy = Math.min(start.y, y) + ry;
            ctx.ellipse(cx, cy, Math.max(1, rx), Math.max(1, ry), 0, 0, 2 * Math.PI);
            ctx.stroke();
          } else if (viewerState.activeTool === 'arrow') {
            ctx.moveTo(start.x, start.y);
            ctx.lineTo(x, y);
            ctx.stroke();
            const angle = Math.atan2(y - start.y, x - start.x);
            const headLen = Math.max(10, viewerState.brushSize * 4);
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x - headLen * Math.cos(angle - Math.PI / 6), y - headLen * Math.sin(angle - Math.PI / 6));
            ctx.moveTo(x, y);
            ctx.lineTo(x - headLen * Math.cos(angle + Math.PI / 6), y - headLen * Math.sin(angle + Math.PI / 6));
            ctx.stroke();
          }
        }
      };

      const endPaint = () => {
        if (!isPaintingRef.current) return;
        isPaintingRef.current = false;
        savePaintSnapshot();
      };

      const savePaintSnapshot = () => {
        const canvas = paintCanvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const snap = ctx.getImageData(0, 0, canvas.width, canvas.height);
        paintUndoStack.current.push(snap);
        if (paintUndoStack.current.length > 25) paintUndoStack.current.shift();
        paintRedoStack.current = [];
      };

      const handlePaintUndo = () => {
        const canvas = paintCanvasRef.current;
        if (!canvas || paintUndoStack.current.length === 0) return;
        const ctx = canvas.getContext('2d');
        const last = paintUndoStack.current.pop();
        paintRedoStack.current.push(last);
        if (paintUndoStack.current.length > 0) {
          const prev = paintUndoStack.current[paintUndoStack.current.length - 1];
          ctx.putImageData(prev, 0, 0);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
        if (data.settings.enableSounds) playXpSound('click');
      };

      const handlePaintRedo = () => {
        const canvas = paintCanvasRef.current;
        if (!canvas || paintRedoStack.current.length === 0) return;
        const ctx = canvas.getContext('2d');
        const next = paintRedoStack.current.pop();
        ctx.putImageData(next, 0, 0);
        paintUndoStack.current.push(next);
        if (data.settings.enableSounds) playXpSound('click');
      };

      const handlePaintClear = () => {
        const canvas = paintCanvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        savePaintSnapshot();
        if (data.settings.enableSounds) playXpSound('recycle');
      };

      const exportViewerImage = (asWallpaper = false) => {
        if (!currentPhoto || !currentPhoto.url) return;
        const canvas = document.createElement('canvas');
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
          canvas.width = img.naturalWidth || 1200;
          canvas.height = img.naturalHeight || 800;
          const ctx = canvas.getContext('2d');

          ctx.save();
          ctx.translate(canvas.width / 2, canvas.height / 2);
          if (viewerState.rotation) ctx.rotate((viewerState.rotation * Math.PI) / 180);
          if (viewerState.flipH) ctx.scale(-1, 1);
          if (viewerState.flipV) ctx.scale(1, -1);
          ctx.drawImage(img, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
          ctx.restore();

          if (viewerState.filter === 'grayscale') {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const d = imgData.data;
            for (let i = 0; i < d.length; i += 4) {
              const v = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
              d[i] = d[i + 1] = d[i + 2] = v;
            }
            ctx.putImageData(imgData, 0, 0);
          } else if (viewerState.filter === 'sepia') {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const d = imgData.data;
            for (let i = 0; i < d.length; i += 4) {
              const r = d[i], g = d[i + 1], b = d[i + 2];
              d[i] = Math.min(255, (r * 0.393) + (g * 0.769) + (b * 0.189));
              d[i + 1] = Math.min(255, (r * 0.349) + (g * 0.686) + (b * 0.168));
              d[i + 2] = Math.min(255, (r * 0.272) + (g * 0.534) + (b * 0.131));
            }
            ctx.putImageData(imgData, 0, 0);
          } else if (viewerState.filter === 'invert') {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const d = imgData.data;
            for (let i = 0; i < d.length; i += 4) {
              d[i] = 255 - d[i];
              d[i + 1] = 255 - d[i + 1];
              d[i + 2] = 255 - d[i + 2];
            }
            ctx.putImageData(imgData, 0, 0);
          }

          if (paintCanvasRef.current) {
            ctx.drawImage(paintCanvasRef.current, 0, 0, canvas.width, canvas.height);
          }

          const finalDataUrl = canvas.toDataURL('image/jpeg', 0.9);
          if (asWallpaper) {
            setWallpaperForCurrentTheme(finalDataUrl);
            if (data.settings.enableSounds) playXpSound('notify');
            setDialogModal({
              isOpen: true,
              title: "Desktop Background Updated",
              icon: "🖼️",
              message: "The edited photo with your markup and filters has been set as your desktop background!"
            });
          } else {
            const a = document.createElement('a');
            a.href = finalDataUrl;
            a.download = `${(currentPhoto.caption || 'photo').toLowerCase().replace(/\s+/g, '-')}-edited.jpg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            if (data.settings.enableSounds) playXpSound('notify');
          }
        };
        img.src = currentPhoto.url;
      };

      useEffect(() => {
        if (!viewerState.isOpen || !viewerState.isSlideshow || viewerState.photos.length <= 1) return;
        const timer = setInterval(() => {
          setViewerState(prev => ({
            ...prev,
            currentIndex: (prev.currentIndex + 1) % prev.photos.length
          }));
        }, 3200);
        return () => clearInterval(timer);
      }, [viewerState.isOpen, viewerState.isSlideshow, viewerState.photos.length]);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (viewerState.isOpen && !viewerState.isMinimized) {
            if (e.key === 'ArrowLeft') {
              setViewerState(prev => ({
                ...prev,
                currentIndex: (prev.currentIndex - 1 + prev.photos.length) % prev.photos.length
              }));
            } else if (e.key === 'ArrowRight' || (e.key === ' ' && !viewerState.isPaintOpen)) {
              setViewerState(prev => ({
                ...prev,
                currentIndex: (prev.currentIndex + 1) % prev.photos.length
              }));
            } else if (e.key === 'z' && (e.ctrlKey || e.metaKey)) {
              handlePaintUndo();
            } else if (e.key === 'y' && (e.ctrlKey || e.metaKey)) {
              handlePaintRedo();
            }
          }
          if (e.key === 'Escape') {
            setActiveMenu(null);
            setDialogModal(prev => ({ ...prev, isOpen: false }));
            setContextMenu(prev => ({ ...prev, visible: false }));
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [viewerState.isOpen, viewerState.isMinimized, viewerState.photos.length, viewerState.isPaintOpen]);

      const handleViewerMouseDown = (e) => {
        e.preventDefault();
        bringViewerToFront();
        if (viewerState.isMaximized) return;
        setDraggingWin('sys-viewer');
        dragStartPos.current = { x: e.clientX, y: e.clientY, winX: viewerState.x, winY: viewerState.y };

        dragStartPos.current = { x: e.clientX, y: e.clientY, iconX: iconPos.x, iconY: iconPos.y };
        lastPointerPosition.current = { x: e.clientX, y: e.clientY };

      const getFreeDesktopPosition = (icons, iconId, requestedX, requestedY) => {
        const { originX, originY, cellWidth, cellHeight, iconWidth, iconHeight } = DESKTOP_GRID;
        const desktopWidth = Math.max(cellWidth, window.innerWidth - 30);
        const desktopHeight = Math.max(cellHeight, window.innerHeight - 70);
        const maxColumn = Math.max(0, Math.floor((desktopWidth - iconWidth) / cellWidth));
        const maxRow = Math.max(0, Math.floor((desktopHeight - iconHeight) / cellHeight));
        const occupied = new Set(Object.entries(icons || {})
          .filter(([id]) => id !== iconId)
          .map(([, position]) => `${Math.round((position.x - originX) / cellWidth)}:${Math.round((position.y - originY) / cellHeight)}`));
        const requestedColumn = Math.max(0, Math.min(maxColumn, Math.round((requestedX - originX) / cellWidth)));
        const requestedRow = Math.max(0, Math.min(maxRow, Math.round((requestedY - originY) / cellHeight)));
        for (let distance = 0; distance <= maxColumn + maxRow + 1; distance += 1) {
          for (let row = Math.max(0, requestedRow - distance); row <= Math.min(maxRow, requestedRow + distance); row += 1) {
            for (let column = Math.max(0, requestedColumn - distance); column <= Math.min(maxColumn, requestedColumn + distance); column += 1) {
              const key = `${column}:${row}`;
              if (!occupied.has(key)) return { x: originX + column * cellWidth, y: originY + row * cellHeight };
            }
          }
        }
        return { x: originX, y: originY };
      };

      const handleMouseMove = (e) => {
        if (draggingWin === 'sys-viewer') {
          const dx = e.clientX - dragStartPos.current.x;

            y: Math.max(0, dragStartPos.current.winY + dy)
          }));
        } else if (resizingWin === 'sys-viewer') {
          const dx = e.clientX - dragStartPos.current.x;
          const dy = e.clientY - dragStartPos.current.y;
          setViewerState(prev => ({
            ...prev,
            width: Math.max(340, dragStartPos.current.winW + dx),
            height: Math.max(240, dragStartPos.current.winH + dy)
          }));
        } else if (draggingWin) {
          const dx = e.clientX - dragStartPos.current.x;
          const dy = e.clientY - dragStartPos.current.y;
          updateWindow(draggingWin, { x: Math.max(0, dragStartPos.current.winX + dx), y: Math.max(0, dragStartPos.current.winY + dy) });
        } else if (resizingWin) {
          const dx = e.clientX - dragStartPos.current.x;
          const dy = e.clientY - dragStartPos.current.y;
          updateWindow(resizingWin, { width: Math.max(280, dragStartPos.current.winW + dx), height: Math.max(180, dragStartPos.current.winH + dy) });
        } else if (draggingIconId) {
          lastPointerPosition.current = { x: e.clientX, y: e.clientY };
          const dx = e.clientX - dragStartPos.current.x;
          const dy = e.clientY - dragStartPos.current.y;
          const newX = Math.max(0, dragStartPos.current.iconX + dx);
          const newY = Math.max(0, dragStartPos.current.iconY + dy);

          setData(prev => ({
            ...prev,
            desktopIcons: { ...(prev.desktopIcons || {}), [draggingIconId]: { x: newX, y: newY } }
          }));
        }
      };

      const handleMouseUp = () => {
        if (draggingIconId) {
          const requestedX = dragStartPos.current.iconX + lastPointerPosition.current.x - dragStartPos.current.x;
          const requestedY = dragStartPos.current.iconY + lastPointerPosition.current.y - dragStartPos.current.y;
          if (data.desktopIcons?.[draggingIconId]) {
            setData(prev => ({
              ...prev,
              desktopIcons: {
                ...(prev.desktopIcons || {}),
                [draggingIconId]: getFreeDesktopPosition(prev.desktopIcons, draggingIconId, requestedX, requestedY)
              }
            }));
          }
        }
        setDraggingWin(null); setResizingWin(null); setDraggingIconId(null);
      };

      const handlePhotoContextMenu = (e, photo, sourceWinId) => {

      const handleDesktopContextMenu = (e) => {

      };

      const getDesktopIconEntries = () => [
        { id: 'sys-computer', title: 'My Computer' },

      ];

      const arrangeDesktopIcons = (sortByName = false) => {

        const arranged = {};
        entries.forEach((entry, index) => {

          arranged[entry.id] = {
            x: DESKTOP_GRID.originX + column * DESKTOP_GRID.cellWidth,

          };

        setData(prev => ({ ...prev, desktopIcons: arranged }));
        setSelectedIconId(null);
        setContextMenu(prev => ({ ...prev, visible: false }));
      };

      const userSections = data.windows.filter(w => w.type !== 'system');
      const allPortfolioPhotos = data.windows.flatMap(w => w.photos || []);

      const winComp = data.windows.find(w => w.id === 'sys-computer');
      const winRecycle = data.windows.find(w => w.id === 'sys-recyclebin');
      const currentPhoto = viewerState.photos[viewerState.currentIndex] || {};

      const currentThemeObj = OS_THEMES.find(t => t.id === (data.settings.osTheme || 'xp')) || OS_THEMES[0];
      const selectedAdminWin = data.windows.find(w => w.id === selectedAdminWinId);

      return (

          style={{

          }}
          onMouseMove={handleMouseMove}

          onClick={() => {

          }}
        >
          <style>{generateXPCss(data.settings)}</style>

          <input 
            type="file"

            ref={directAddFileInputRef}

            onChange={handleDirectPhotoFileSelect} 
          />

          <div className="desktop" onClick={() => setSelectedIconId(null)}>
            <div 
              className={`desktop-icon ${selectedIconId === 'sys-computer' ? 'selected' : ''}`}
              style={{ left: data.desktopIcons?.['sys-computer']?.x ?? 15, top: data.desktopIcons?.['sys-computer']?.y ?? 15 }}
              onDoubleClick={() => openWindow('sys-computer')}
              onClick={(e) => e.stopPropagation()}
              onMouseDown={(e) => handleIconMouseDown(e, 'sys-computer')}
            >
              <ThemeComputerIcon theme={data.settings.osTheme} />
              <span>My Computer</span>
            </div>

            <div

              style={{ left: data.desktopIcons?.['sys-recyclebin']?.x ?? DESKTOP_GRID.originX, top: data.desktopIcons?.['sys-recyclebin']?.y ?? (DESKTOP_GRID.originY + DESKTOP_GRID.cellHeight) }}
              onDoubleClick={() => openWindow('sys-recyclebin')}
              onClick={(e) => e.stopPropagation()}
              onMouseDown={(e) => handleIconMouseDown(e, 'sys-recyclebin')}
            >
              <ThemeRecycleBinIcon theme={data.settings.osTheme} isFull={(data.recycleBin || []).length > 0} />
              <span>Recycle Bin</span>
            </div>
            <div
              className={`desktop-icon ${selectedIconId === 'paint' ? 'selected' : ''}`}
              style={{ left: data.desktopIcons?.paint?.x ?? DESKTOP_GRID.originX, top: data.desktopIcons?.paint?.y ?? (DESKTOP_GRID.originY + (DESKTOP_GRID.cellHeight * 4)) }}
              onDoubleClick={openPaint}

            >

              return (
                <div

                >
                  {isText ? <ThemeNotepadIcon theme={data.settings.osTheme} /> : <ThemeFolderIcon theme={data.settings.osTheme} />}

            {}

              const isClassic = data.settings.osTheme === 'w2k' || data.settings.osTheme === 'w98';
              const textFontSize = textDocFontSizes[win.id] || 12;

              const textMenuConfig = [
                {

                    },

                    },
                    { separator: true },
                    {

                </div>
                <div className="start-menu-right">
                  <div className="start-item" onClick={() => { openWindow('sys-computer'); setMyComputerTab('control'); setIsStartOpen(false); }}>💻 My Computer</div>
                  <div className="start-item" onClick={() => { openPaint(); setIsStartOpen(false); }}>🎨 Paint</div>
                  <div className="start-item" onClick={() => { openWindow('sys-recyclebin'); setIsStartOpen(false); }}>🗑️ Recycle Bin</div>
                </div>
              </div>
              <div className="start-menu-footer">
                <button className="start-footer-btn" onClick={() => { setIsStartOpen(false); setShowShutdownModal(true); }}>🔴 Turn Off Computer</button>
              </div>
            </div>
          )}

          {}
          <div className="taskbar" onClick={(e) => e.stopPropagation()}>
            <button className="start-btn" onClick={() => setIsStartOpen(!isStartOpen)}>start</button>
            <div className="taskbar-items">
              {data.windows.filter(win => win.isOpen).map(win => (
                <div 
                  key={`task-${win.id}`} 
                  className={`taskbar-item ${!win.isMinimized && win.zIndex === highestZIndex && (!viewerState.isOpen || viewerState.isMinimized || viewerState.zIndex < win.zIndex) ? 'active' : ''}`}
                  onClick={() => { if (!win.isMinimized && win.zIndex === highestZIndex && viewerState.zIndex <= win.zIndex) toggleMinimize(win.id); else openWindow(win.id); }}
                >
                  <span className="truncate">{win.title}</span>
                </div>
              ))}
              {viewerState.isOpen && (
                <div 
                  className={`taskbar-item ${!viewerState.isMinimized && viewerState.zIndex === highestZIndex ? 'active' : ''}`}
                  onClick={() => {
                    if (!viewerState.isMinimized && viewerState.zIndex === highestZIndex) {
                      setViewerState(vs => ({ ...vs, isMinimized: true }));
                    } else {
                      bringViewerToFront();
                    }
                  }}
                >
                  <span className="truncate">🖼️ {viewerState.title || 'Photo Viewer'}</span>
                </div>
              )}
            </div>
            <div className="system-tray">
              <span>{sysTime}</span>
            </div>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
