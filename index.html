<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Jason Ward Photography</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18, ReactDOM & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'xp-portfolio-app';
    let firebaseConfig = null;
    try {
      if (typeof __firebase_config !== 'undefined' && __firebase_config) {
        firebaseConfig = JSON.parse(__firebase_config);
      }
    } catch(e) {}

    window.FirebaseBridge = {
      appId,
      firebaseConfig,
      initializeApp,
      getAuth,
      signInAnonymously,
      signInWithCustomToken,
      onAuthStateChanged,
      getFirestore,
      doc,
      setDoc,
      setDoc
    };
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tahoma:wght@400;700&display=swap');

    :root {
      --xp-bg: #ece9d8;
      --xp-blue: #0055e5;
      --xp-title-gradient: linear-gradient(to bottom, #0058e6 0%, #3a93ff 4%, #288eff 6%, #127dff 8%, #036bfe 10%, #005ce3 14%, #003db3 100%);
      --xp-title-text: #ffffff;
      --xp-taskbar: linear-gradient(to bottom, #245edb 0%, #3f8cf3 9%, #245edb 18%, #245edb 92%, #1941a5 100%);
      --xp-start-btn: linear-gradient(to bottom, #4c9900 0%, #53a600 10%, #3c8000 50%, #3c8000 90%, #295700 100%);
    }

    body {
      font-family: 'Tahoma', sans-serif;
      margin: 0; padding: 0; overflow: hidden;
      height: 100vh; width: 100vw;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .desktop {
      width: 100%; height: calc(100vh - 40px);
      position: relative; padding: 15px;
    }
    .desktop-icon {
      position: absolute;
      display: flex; flex-direction: column; align-items: center;
      box-sizing: border-box; width: 104px; height: 104px; cursor: move; color: white;
      text-shadow: 1px 1px 2px black; font-size: 11px; text-align: center;
      padding: 12px 6px; border: 1px dashed transparent; border-radius: 3px;
      z-index: 5; touch-action: none;
    }
    .desktop-icon:hover { background: rgba(255,255,255,0.25); border-color: rgba(255,255,255,0.5); }
    .desktop-icon.dragging { cursor: grabbing; z-index: 20; }
    .desktop-icon.drag-preview { opacity: 0.5; pointer-events: none; z-index: 30; }
    .desktop-icon.selected { background: rgba(11, 97, 255, 0.4); border-color: rgba(255,255,255,0.8); }
    .desktop-icon svg, .desktop-icon img { width: 38px; height: 38px; flex-shrink: 0; margin-bottom: 4px; filter: drop-shadow(1px 2px 3px rgba(0,0,0,0.6)); pointer-events: none; }

    .xp-window {
      position: absolute; display: flex; flex-direction: column;
      background: var(--xp-bg);
      border: 3px solid var(--xp-blue);
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
      box-shadow: 3px 3px 12px rgba(0,0,0,0.4);
      min-width: 280px; min-height: 180px;
    }

    .xp-window.classic-win {
      border: 2px solid;
      border-color: #ffffff #808080 #808080 #ffffff;
      border-top-left-radius: 0;
      border-top-right-radius: 0;
      box-shadow: 2px 2px 0px #000;
    }

    .xp-window.maximized {
      top: 0 !important; left: 0 !important;
      width: 100% !important; height: calc(100vh - 40px) !important;
      border-radius: 0; border: none; resize: none;
    }

    .xp-titlebar {
      background: var(--xp-title-gradient); color: var(--xp-title-text);
      padding: 3px 6px; font-weight: bold; font-size: 12px;
      display: flex; justify-content: space-between; align-items: center;
      cursor: move;
      touch-action: none;
      border-top-left-radius: 5px;
      border-top-right-radius: 5px;
      flex-shrink: 0;
    }
    .classic-win .xp-titlebar {
      border-top-left-radius: 0;
      border-top-right-radius: 0;
    }

    .xp-controls { display: flex; gap: 2px; }
    .xp-controls button {
      width: 21px; height: 21px; font-size: 11px; font-weight: bold;
      border: 1px solid #fff; border-radius: 3px;
      background-color: #d7d1c5; color: #222;
      display: flex; justify-content: center; align-items: center;
      cursor: pointer; box-shadow: inset -1px -1px 2px rgba(0,0,0,0.5), inset 1px 1px 2px rgba(255,255,255,0.8);
    }
    .classic-win .xp-controls button {
      border: 2px solid; border-color: #ffffff #808080 #808080 #ffffff;
      border-radius: 0; box-shadow: none;
    }
    .xp-controls button:active { box-shadow: inset 1px 1px 2px rgba(0,0,0,0.6); }
    .xp-controls button.close { background-color: #e44f2c; color: white; }
    .xp-controls button.close:hover { background-color: #ff3b10; }

    .xp-menu-bar {
      background: var(--xp-bg); padding: 2px 4px; font-size: 11px; color: #000;
      border-bottom: 1px solid #c0c0c0; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
      position: relative;
    }

    .xp-menu-item { padding: 3px 8px; cursor: pointer; border: 1px solid transparent; position: relative; }
    .xp-menu-item:hover, .xp-menu-item.active { background: #316ac5; color: white; }

    .xp-menu-dropdown {
      position: absolute; top: 100%; left: 0; background: #fff; color: #000;
      border: 1px solid #7f9db9; box-shadow: 2px 2px 8px rgba(0,0,0,0.25);
      min-width: 160px; z-index: 1000; display: flex; flex-direction: column; padding: 2px;
    }
    .xp-menu-dropdown-item { padding: 5px 10px; font-size: 11px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .xp-menu-dropdown-item:hover { background: #316ac5; color: white; }

    .xp-content { flex-grow: 1; min-height: 0; background: #fff; margin: 2px; border: 1px solid #7f9db9; padding: 10px; overflow-y: auto; }
    .text-document-content { overflow: hidden; }
    .xp-resize-handle {
      position: absolute; z-index: 50;
    }
    .xp-resize-handle.n, .xp-resize-handle.s { left: 10px; right: 10px; height: 8px; }
    .xp-resize-handle.n { top: -4px; cursor: n-resize; }
    .xp-resize-handle.s { bottom: -4px; cursor: s-resize; }
    .xp-resize-handle.e, .xp-resize-handle.w { top: 10px; bottom: 10px; width: 8px; }
    .xp-resize-handle.e { right: -4px; cursor: e-resize; }
    .xp-resize-handle.w { left: -4px; cursor: w-resize; }
    .xp-resize-handle.ne, .xp-resize-handle.nw, .xp-resize-handle.se, .xp-resize-handle.sw {
      width: 12px; height: 12px;
    }
    .xp-resize-handle.ne { top: -4px; right: -4px; cursor: ne-resize; }
    .xp-resize-handle.nw { top: -4px; left: -4px; cursor: nw-resize; }
    .xp-resize-handle.se { right: -4px; bottom: -4px; cursor: se-resize;
      background: linear-gradient(135deg, transparent 50%, #888 50%, #888 60%, transparent 60%, transparent 75%, #888 75%);
    }
    .xp-resize-handle.sw { bottom: -4px; left: -4px; cursor: sw-resize;

    }

    .layout-grid-thumbnails {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
      align-items: start;
    }
    .photo-item-card {
      contain: content;
      content-visibility: auto;
      contain-intrinsic-size: 130px;
      background: #fbfbfb;
      border: 1px solid #c0c0c0;
      padding: 4px;

      flex-direction: column;

    .photo-item-card:hover {

      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }
    .photo-item-card-img-wrap {
      width: 100%;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 1px;
    }
    .photo-item-card-img-wrap img {
      width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
    }
    .photo-item-card-caption {
      font-size: 10px;
      color: #333;
      text-align: center;
      margin-top: 4px;
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .layout-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .photo-item-list {
      contain: content;
      content-visibility: auto;
      contain-intrinsic-size: 40px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 3px 6px;
      border: 1px solid transparent;
      cursor: pointer;
      border-radius: 2px;
    }
    .photo-item-list:hover {
      background: #e8f2fe;
      border-color: #7f9db9;
    }
    .photo-item-list.selected { background: #d7e8fb; border-color: #316ac5; }
    .photo-item-list img {
      width: 44px;
      height: auto;
      max-height: 44px;
      object-fit: contain;
      border-radius: 1px;
      flex-shrink: 0;
      background: #222;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--photo-tile-width), var(--photo-tile-width)));
      grid-auto-rows: var(--photo-image-height);
      gap: 8px;
      align-content: start;
      justify-content: space-between;
    }
    .photo-grid-small { --photo-tile-width: 104px; --photo-image-height: 72px; }
    .photo-grid-medium { --photo-tile-width: 148px; --photo-image-height: 108px; }
    .photo-grid-large { --photo-tile-width: 216px; --photo-image-height: 156px; }
    .photo-grid .photo-item-clean {
      width: var(--photo-tile-width);
      height: var(--photo-image-height);
      min-width: 0;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
    }
    .photo-grid .photo-item-clean:hover,
    .photo-grid .photo-item-clean.selected { background: rgba(49, 106, 197, 0.12); }
    .photo-item-clean-wrap {
      width: 100%; height: 100%; background: #1a1a1a;
      display: flex; align-items: center; justify-content: center;
    }
    .photo-grid .photo-item-clean-wrap { background: #ffffff; }
    .photo-item-clean-wrap img { width: 100%; height: 100%; object-fit: contain; display: block; border: 2px solid #ffffff; box-sizing: border-box; }
    .photo-justified { display: flex; flex-direction: column; gap: 8px; }
    .photo-justified-row { display: flex; gap: 8px; width: 100%; }
    .photo-justified .photo-item-clean { min-width: 0; min-height: 0; padding: 0; border: none; background: transparent; cursor: pointer; }
    .photo-justified .photo-item-clean:hover,
    .photo-justified .photo-item-clean.selected { background: rgba(49, 106, 197, 0.12); }
    .photo-justified .photo-item-clean-wrap img { border: none; }

    .taskbar {
      background: var(--xp-taskbar); height: 40px; width: 100%;

      box-shadow: 0 -2px 5px rgba(0,0,0,0.3);

    .start-btn {
      background: var(--xp-start-btn); color: white; font-weight: bold; font-style: italic; font-size: 14px; height: 100%;
      padding: 0 12px 0 8px; border: none; border-radius: 0 15px 15px 0;
      display: flex; align-items: center; gap: 6px; cursor: pointer; box-shadow: 2px 0 5px rgba(0,0,0,0.3);

    .taskbar-items { display: flex; flex-grow: 1; padding: 0 8px; gap: 4px; overflow-x: auto; }
    .taskbar-item {
      background: linear-gradient(to bottom, #3a84f3 0%, #1e53c4 100%); color: white; padding: 4px 10px; border-radius: 3px; font-size: 11px; cursor: pointer;
      min-width: 110px; max-width: 180px; display: flex; align-items: center; gap: 6px; border: 1px solid #16367c;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .taskbar-item.active { background: linear-gradient(to bottom, #1e53c4 0%, #11368a 100%); font-weight: normal; }
    .system-tray {
      background: linear-gradient(to bottom, #19a1e6 0%, #0c71cc 100%); height: 100%; padding: 0 12px; display: flex; align-items: center; gap: 10px; color: white; font-size: 11px; border-left: 1px solid #16367c;
    }

    .start-menu {
      position: absolute; bottom: 40px; left: 0; width: 360px; background: #fff; border: 2px solid var(--xp-blue);
      border-top-right-radius: 8px; box-shadow: 4px 4px 15px rgba(0,0,0,0.5); display: flex; flex-direction: column; z-index: 100000; overflow: hidden;
    }
    .start-menu-header { background: var(--xp-blue); color: white; padding: 10px 12px; display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 14px; }
    .start-menu-body { display: flex; height: 280px; }
    .start-menu-left { width: 50%; padding: 8px; display: flex; flex-direction: column; gap: 4px; background: #fff; border-right: 1px solid #dcdcdc; }
    .start-menu-right { width: 50%; padding: 8px; display: flex; flex-direction: column; gap: 4px; background: #d3e5fa; }
    .start-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; font-size: 11px; color: #333; cursor: pointer; border-radius: 3px; }
    .start-item:hover { background: #316ac5; color: white; }
    .start-menu-footer { background: linear-gradient(to bottom, #4282d6 0%, #2058ad 100%); padding: 8px 12px; display: flex; justify-content: flex-end; gap: 12px; }
    .start-footer-btn { background: transparent; border: none; color: white; font-size: 11px; display: flex; align-items: center; gap: 6px; cursor: pointer; }

    .xp-paint-toolbar {
      background: var(--xp-bg); border-right: 2px solid #808080; border-top: 1px solid #fff; border-left: 1px solid #fff;
      padding: 4px; display: flex; flex-direction: column; gap: 4px; width: 66px; flex-shrink: 0; user-select: none;
    }
    .xp-paint-btn {
      width: 24px; height: 24px; font-size: 12px; display: flex; align-items: center; justify-content: center;
      border: 1px solid transparent; background: transparent; cursor: pointer; border-radius: 2px;
    }
    .xp-paint-btn:hover { background: #d3e5fa; border-color: #316ac5; }
    .xp-paint-btn.active { background: #b8cde8; border-color: #245edb; box-shadow: inset 1px 1px 2px rgba(0,0,0,0.3); }
    .xp-color-swatch {
      width: 12px; height: 12px; border: 1px solid #808080; cursor: pointer;
    }
    .xp-color-swatch.selected { outline: 2px solid #000; z-index: 2; }
    .xp-menu-separator { height: 1px; background: #d0d0d0; margin: 3px 0; }
    .xp-dialog-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 500000;
      display: flex; align-items: center; justify-content: center;
    }
    .xp-dialog-box {
      width: 400px; background: var(--xp-bg); border: 3px solid var(--xp-blue);
      border-radius: 6px; box-shadow: 4px 4px 20px rgba(0,0,0,0.5); overflow: hidden;
    }

    button, input, select, textarea, [role="button"] { touch-action: manipulation; }

    @media (max-width: 640px) {
      body { height: 100dvh; width: 100%; }
      .desktop { height: calc(100dvh - 52px); padding: 8px; }
      .desktop-icon { width: 82px; height: 82px; padding: 7px 4px; font-size: 10px; }
      .desktop-icon svg, .desktop-icon img { width: 32px; height: 32px; }
      .xp-window {
        left: 4px !important; top: 4px !important;
        width: calc(100vw - 8px) !important; height: calc(100dvh - 60px) !important;
        min-width: 0; min-height: 0; border-width: 2px;
      }
      .xp-window.maximized { height: calc(100dvh - 52px) !important; }
      .xp-titlebar { min-height: 32px; padding: 4px 5px; font-size: 11px; }
      .xp-controls { gap: 3px; }
      .xp-controls button { width: 30px; height: 28px; font-size: 13px; }
      .xp-menu-bar { overflow-x: auto; min-height: 32px; padding: 2px; }
      .xp-menu-item { padding: 7px 10px; flex-shrink: 0; }
      .xp-menu-dropdown { position: fixed; top: auto; left: 4px; right: 4px; width: auto; min-width: 0; max-height: 60dvh; overflow-y: auto; }
      .xp-menu-dropdown-item { min-height: 42px; padding: 8px 10px; font-size: 12px; }
      .xp-content { padding: 7px; margin: 1px; }
      .layout-grid-thumbnails { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .photo-item-list { min-height: 52px; padding: 4px; }
      .taskbar { height: 52px; }
      .start-btn { min-width: 76px; padding: 0 10px 0 7px; font-size: 13px; }
      .taskbar-items { padding: 0 4px; gap: 3px; }
      .taskbar-item { min-width: 88px; max-width: 130px; min-height: 36px; padding: 5px 7px; }
      .system-tray { padding: 0 7px; gap: 5px; font-size: 10px; }
      .start-menu { bottom: 52px; width: calc(100vw - 8px); max-width: 360px; }
      .start-menu-body { height: 240px; }
      .start-item { min-height: 38px; padding: 8px; }
      .xp-dialog-box { width: calc(100vw - 24px); max-height: calc(100dvh - 32px); overflow-y: auto; }
      .xp-paint-toolbar { width: 54px; }
      .xp-paint-btn { width: 40px; height: 40px; }
      .xp-color-swatch { width: 22px; height: 22px; }
      .xp-resize-handle { display: none; }
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const DESKTOP_GRID = { originX: 15, originY: 15, cellSize: 108, iconSize: 104 };
    const assetCacheVersion = Date.now().toString(36);
    const photoDimensionCache = new Map();
    const photoDimensionValues = new Map();

    const getAssetUrl = (url) => {
      if (!url || !url.startsWith('images/')) return url;
      return `${url}${url.includes('?') ? '&' : '?'}v=${assetCacheVersion}`;
    };

    // The gallery needs image proportions before it can place justified rows.
    // Probe dimensions when a folder opens, while the real gallery images stay lazy.
    const getPhotoDimensions = (photo) => {
      if (!photo?.url) return Promise.resolve(null);
      if (photoDimensionCache.has(photo.url)) return photoDimensionCache.get(photo.url);

      const dimensionsPromise = new Promise(resolve => {
        const image = new Image();
        image.onload = () => {
          const dimensions = { width: image.naturalWidth, height: image.naturalHeight };
          photoDimensionValues.set(photo.url, dimensions);
          resolve(dimensions);
        };
        image.onerror = () => resolve(null);
        image.src = getAssetUrl(photo.url);
      });
      photoDimensionCache.set(photo.url, dimensionsPromise);
      return dimensionsPromise;
    };

    const fetchFreshManifest = (url) => fetch(`${url}${url.includes('?') ? '&' : '?'}v=${assetCacheVersion}`, { cache: 'no-store' })
      .then(response => response.ok ? response.text() : '')
      .catch(() => '');

    const parseManifest = (manifestText) => {
      try {
        if (!manifestText) return [];
        const conflictSeparator = manifestText.indexOf('=======');
        const conflictEnd = manifestText.indexOf('>>>>>>>', conflictSeparator);
        let cleanManifestText = conflictSeparator >= 0 && conflictEnd > conflictSeparator
          ? manifestText.slice(conflictSeparator + '======='.length, conflictEnd).trim()
          : manifestText.replace(/^\uFEFF/, '').trim();
        if (conflictSeparator >= 0 && conflictEnd > conflictSeparator && !cleanManifestText.endsWith(']')) {
          cleanManifestText += ']';
        }
        return JSON.parse(cleanManifestText);
      } catch (error) {
        return [];
      }
    };

    // GitHub is the source of truth for folders and photos. The local file keeps
    // the portfolio usable when the raw GitHub request is unavailable.
    const imageManifestPromise = fetchFreshManifest('https://raw.githubusercontent.com/jasonlfward/jasonlfward.github.io/main/images.json')
      .then(manifestText => {
        const remoteManifest = parseManifest(manifestText);
        return remoteManifest.length > 0 ? remoteManifest : fetchFreshManifest('images.json').then(parseManifest);
      })
      .then(images => Array.isArray(images) ? images : [])
      .then(manifest => {
        const manifestPhotos = manifest.flatMap(folder => Array.isArray(folder.photos) ? folder.photos : [folder]);
        // Warm the proportion cache during startup so opening a folder does
        // not begin with guessed 4:3 positions.
        manifestPhotos.forEach(photo => getPhotoDimensions(photo));
        return manifest;
      })
      .catch(() => []);

    const playXpSound = (type) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();

        if (type === 'click') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.04);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + 0.04);
        } else if (type === 'error') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(160, ctx.currentTime);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + 0.25);
        } else if (type === 'recycle') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(400, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 0.18);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + 0.18);
        } else if (type === 'notify') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + 0.25);
        }
      } catch(e) {}
    };

        Promise.all(openGalleryPhotos.map(photo => getPhotoDimensions(photo)))
          .then(results => {
            setPhotoDimensions(previous => {
              const next = { ...previous };
              let changed = false;
              openGalleryPhotos.forEach((photo, index) => {
                const dimensions = results[index];
                if (dimensions && !next[photo.id]) {
                  next[photo.id] = dimensions;
                  changed = true;
                }
              });
              return changed ? next : previous;
            });

      const getJustifiedRows = (photos, containerWidth, targetHeight) => {
        if (!photos.length || containerWidth <= 0) return [];
        const gap = 8;
        const rows = [];
        let row = [];
        let aspectTotal = 0;
        photos.forEach((photo, index) => {
          const dimensions = photoDimensions[photo.id] || photoDimensionValues.get(photo.url);
          const aspect = dimensions ? dimensions.width / dimensions.height : 4 / 3;
          row.push({ photo, aspect });
          aspectTotal += aspect;
          const idealWidth = aspectTotal * targetHeight + gap * (row.length - 1);
          if (idealWidth >= containerWidth || index === photos.length - 1) {
            const rowHeight = Math.max(80, (containerWidth - gap * (row.length - 1)) / aspectTotal);
            rows.push(row.map(item => ({ ...item, width: item.aspect * rowHeight, height: rowHeight })));
            row = [];
            aspectTotal = 0;
          }
        });
        return rows;

        const scaleY = canvas.height / rect.height;

          x: (e.clientX - rect.left) * scaleX,
          y: (e.clientY - rect.top) * scaleY
        };

        paintStartPosRef.current = { x, y };

          if (txt) {

          return;
        }

        isPaintingRef.current = true;
        paintSnapshotRef.current = ctx.getImageData(0, 0, canvas.width, canvas.height);

        ctx.lineWidth = paintState.brushSize;
        ctx.strokeStyle = paintState.brushColor;
        ctx.fillStyle = paintState.brushColor;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        if (paintState.activeTool === 'eraser') {
          ctx.globalCompositeOperation = 'destination-out';
          ctx.lineWidth = paintState.brushSize * 3;
        } else if (paintState.activeTool === 'brush') {
          ctx.globalCompositeOperation = 'source-over';
          ctx.lineWidth = paintState.brushSize * 2.5;
        } else {
          ctx.globalCompositeOperation = 'source-over';
        }

        if (paintState.activeTool === 'pencil' || paintState.activeTool === 'brush' || paintState.activeTool === 'eraser') {
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x, y);

        }

        const canvas = paintCanvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const { x, y } = getCanvasCoords(e);
        const start = paintStartPosRef.current;

        if (paintState.activeTool === 'pencil' || paintState.activeTool === 'brush' || paintState.activeTool === 'eraser') {
          ctx.lineTo(x, y);
          ctx.stroke();
        } else if (['line', 'rect', 'circle', 'arrow'].includes(paintState.activeTool)) {
          if (paintSnapshotRef.current) {
            ctx.putImageData(paintSnapshotRef.current, 0, 0);
          }
          ctx.beginPath();
          ctx.lineWidth = paintState.brushSize;
          ctx.strokeStyle = paintState.brushColor;
          ctx.fillStyle = paintState.brushColor;
          ctx.lineCap = 'round';

          if (paintState.activeTool === 'line') {
            ctx.moveTo(start.x, start.y);
            ctx.lineTo(x, y);
            ctx.stroke();
          } else if (paintState.activeTool === 'rect') {

            const rx = Math.abs(x - start.x) / 2;
            const ry = Math.abs(y - start.y) / 2;
            const cx = Math.min(start.x, x) + rx;
            const cy = Math.min(start.y, y) + ry;
            ctx.ellipse(cx, cy, Math.max(1, rx), Math.max(1, ry), 0, 0, 2 * Math.PI);
            ctx.stroke();
          } else if (paintState.activeTool === 'arrow') {
            ctx.moveTo(start.x, start.y);
            ctx.lineTo(x, y);
            ctx.stroke();
            const angle = Math.atan2(y - start.y, x - start.x);
            const headLen = Math.max(10, paintState.brushSize * 4);
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x - headLen * Math.cos(angle - Math.PI / 6), y - headLen * Math.sin(angle - Math.PI / 6));

            ctx.lineTo(x - headLen * Math.cos(angle + Math.PI / 6), y - headLen * Math.sin(angle + Math.PI / 6));
            ctx.stroke();

        const ctx = canvas.getContext('2d');
        const last = paintUndoStack.current.pop();
        paintRedoStack.current.push(last);
        if (paintUndoStack.current.length > 0) {

        } else {

      const exportViewerImage = (asWallpaper = false) => {
        if (!currentPhoto || !currentPhoto.url) return;
        const canvas = document.createElement('canvas');
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
          canvas.width = img.naturalWidth || 1200;
          canvas.height = img.naturalHeight || 800;
          const ctx = canvas.getContext('2d');

          ctx.save();
          ctx.translate(canvas.width / 2, canvas.height / 2);
          if (viewerState.rotation) ctx.rotate((viewerState.rotation * Math.PI) / 180);
          if (viewerState.flipH) ctx.scale(-1, 1);
          if (viewerState.flipV) ctx.scale(1, -1);
          ctx.drawImage(img, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
          ctx.restore();

          if (viewerState.filter === 'grayscale') {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const d = imgData.data;
            for (let i = 0; i < d.length; i += 4) {
              const v = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
              d[i] = d[i + 1] = d[i + 2] = v;
            }
            ctx.putImageData(imgData, 0, 0);
          } else if (viewerState.filter === 'sepia') {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const d = imgData.data;
            for (let i = 0; i < d.length; i += 4) {
              const r = d[i], g = d[i + 1], b = d[i + 2];
              d[i] = Math.min(255, (r * 0.393) + (g * 0.769) + (b * 0.189));
              d[i + 1] = Math.min(255, (r * 0.349) + (g * 0.686) + (b * 0.168));
              d[i + 2] = Math.min(255, (r * 0.272) + (g * 0.534) + (b * 0.131));
            }
            ctx.putImageData(imgData, 0, 0);
          } else if (viewerState.filter === 'invert') {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const d = imgData.data;
            for (let i = 0; i < d.length; i += 4) {
              d[i] = 255 - d[i];
              d[i + 1] = 255 - d[i + 1];
              d[i + 2] = 255 - d[i + 2];
            }
            ctx.putImageData(imgData, 0, 0);
          }

          const finalDataUrl = canvas.toDataURL('image/jpeg', 0.9);
          if (asWallpaper) {
            setWallpaperForCurrentTheme(finalDataUrl);
            if (data.settings.enableSounds) playXpSound('notify');
            setDialogModal({
              isOpen: true,
              title: "Desktop Background Updated",
              icon: "🖼️",

            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            if (data.settings.enableSounds) playXpSound('notify');
          }
        };

      useEffect(() => {

      useEffect(() => {

      useEffect(() => {

              setViewerState(prev => ({
                ...prev,

      const handleViewerMouseDown = (e) => {

        setResizingWin('sys-viewer');

      const handleViewerPanDown = (e) => {
        if (viewerState.isPaintOpen) return;

        if (e.pointerType === 'touch') {
          viewerTouchPointsRef.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
          if (viewerTouchPointsRef.current.size === 2) {
            const points = [...viewerTouchPointsRef.current.values()];
            const midpoint = { x: (points[0].x + points[1].x) / 2, y: (points[0].y + points[1].y) / 2 };
            viewerGestureRef.current = {
              distance: Math.hypot(points[1].x - points[0].x, points[1].y - points[0].y),
              zoom: viewerState.zoom,
              midpoint,
              panX: viewerState.panX,
              panY: viewerState.panY
            };
            isPanningRef.current = false;
            e.preventDefault();
            e.stopPropagation();
          }
        }
        if (viewerState.zoom <= 100 || viewerTouchPointsRef.current.size > 1) return;
        e.preventDefault();
        e.stopPropagation();
        try { e.currentTarget.setPointerCapture?.(e.pointerId); } catch (err) {}

        panStartRef.current = { x: e.clientX, y: e.clientY, panX: viewerState.panX, panY: viewerState.panY };
      };

      const handleViewerPanMove = (e) => {
        if (e.pointerType === 'touch' && viewerTouchPointsRef.current.has(e.pointerId)) {
          viewerTouchPointsRef.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
          if (viewerTouchPointsRef.current.size >= 2 && viewerGestureRef.current) {
            const points = [...viewerTouchPointsRef.current.values()];
            const distance = Math.hypot(points[1].x - points[0].x, points[1].y - points[0].y);
            const midpoint = { x: (points[0].x + points[1].x) / 2, y: (points[0].y + points[1].y) / 2 };
            const gesture = viewerGestureRef.current;
            setViewerState(prev => ({
              ...prev,
              zoom: Math.max(100, Math.min(300, gesture.zoom * (distance / Math.max(1, gesture.distance)))),
              panX: gesture.panX + midpoint.x - gesture.midpoint.x,
              panY: gesture.panY + midpoint.y - gesture.midpoint.y
            }));
            return;
          }
        }
        if (!isPanningRef.current) return;
        setViewerState(prev => ({
          ...prev,
          panX: panStartRef.current.panX + e.clientX - panStartRef.current.x,
          panY: panStartRef.current.panY + e.clientY - panStartRef.current.y
        }));
      };

      const handleViewerPanUp = (e) => {
        if (e.pointerType === 'touch') {
          viewerTouchPointsRef.current.delete(e.pointerId);
          if (viewerTouchPointsRef.current.size < 2) viewerGestureRef.current = null;
        }
        isPanningRef.current = false;
        try { if (e.currentTarget.hasPointerCapture?.(e.pointerId)) e.currentTarget.releasePointerCapture(e.pointerId); } catch (err) {}
      };

      const handleMouseDown = (e, winId) => {
        e.preventDefault();

        if (!win || win.isMaximized) return;

        dragStartPos.current = { x: e.clientX, y: e.clientY, winX: win.x, winY: win.y };

      const handleThumbnailSliderPointerDown = (e, winId) => {

        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
      };

      const handleThumbnailSliderPointerUp = (e, winId) => {
        try {
          if (e.currentTarget.hasPointerCapture(e.pointerId)) {
            e.currentTarget.releasePointerCapture(e.pointerId);
          }
        } catch (err) {}
        updateWindow(winId, { thumbnailSize: Number(e.currentTarget.value) });
        e.stopPropagation();
      };

      const handleResizeDown = (e, winId, direction = 'se') => {
        e.preventDefault(); e.stopPropagation();
        bringToFront(winId);
        const win = data.windows.find(w => w.id === winId);
        if (!win || win.isMaximized) return;

        setResizingWin(winId);
        setResizeDirection(direction);
        dragStartPos.current = { x: e.clientX, y: e.clientY, winX: win.x, winY: win.y, winW: win.width, winH: win.height };
      };

      const getResizedBounds = (minWidth, minHeight, clientX, clientY) => {
        const { x: startX, y: startY, winX: startWindowX, winY: startWindowY, winW: startWidth, winH: startHeight } = dragStartPos.current;
        const horizontalDelta = clientX - startX;
        const verticalDelta = clientY - startY;
        const resizesWest = resizeDirection.includes('w');
        const resizesNorth = resizeDirection.includes('n');
        const resizesHorizontal = resizeDirection.includes('e') || resizesWest;
        const resizesVertical = resizeDirection.includes('s') || resizesNorth;
        const width = resizesHorizontal
          ? Math.max(minWidth, startWidth + (resizesWest ? -horizontalDelta : horizontalDelta))
          : startWidth;
        const height = resizesVertical
          ? Math.max(minHeight, startHeight + (resizesNorth ? -verticalDelta : verticalDelta))
          : startHeight;
        return {
          x: resizesWest ? startWindowX + startWidth - width : undefined,
          y: resizesNorth ? startWindowY + startHeight - height : undefined,
          width,
          height
        };
      };

      const handleIconMouseDown = (e, iconId) => {
        e.preventDefault(); e.stopPropagation();
        e.currentTarget.style.touchAction = 'none';
        try { e.currentTarget.setPointerCapture?.(e.pointerId); } catch (err) {}
        setSelectedIconId(iconId);
        draggingIconIdRef.current = iconId;
        
        const iconPos = data.desktopIcons?.[iconId] || { x: DESKTOP_GRID.originX, y: DESKTOP_GRID.originY };
        dragStartPos.current = {
          x: e.clientX,
          y: e.clientY,
          iconX: iconPos.x,
          iconY: iconPos.y,
          grabOffsetX: e.clientX - iconPos.x,
          grabOffsetY: e.clientY - iconPos.y
        };
        lastPointerPosition.current = { x: e.clientX, y: e.clientY };
        setDraggingIconId(iconId);
        setDragPreviewPosition({ x: iconPos.x, y: iconPos.y });
      };

      const getFreeDesktopPosition = (icons, iconId, requestedX, requestedY, appendByColumn = false) => {
        const { originX, originY, cellSize, iconSize } = DESKTOP_GRID;
        const desktopWidth = Math.max(cellSize, window.innerWidth - 30);
        const desktopHeight = Math.max(cellSize, window.innerHeight - 70);
        const maxColumn = Math.max(0, Math.floor((desktopWidth - iconSize) / cellSize));
        const maxRow = Math.max(0, Math.floor((desktopHeight - iconSize) / cellSize));
        const occupied = new Set(Object.entries(icons || {})
          .filter(([id]) => id !== iconId)
          .map(([, position]) => `${Math.round((position.x - originX) / cellSize)}:${Math.round((position.y - originY) / cellSize)}`));
        const requestedColumn = Math.max(0, Math.min(maxColumn, Math.round((requestedX - originX) / cellSize)));
        const requestedRow = Math.max(0, Math.min(maxRow, Math.round((requestedY - originY) / cellSize)));
        if (appendByColumn) {
          for (let column = 0; column <= maxColumn; column += 1) {
            const occupiedRows = [...occupied]
              .filter(key => Number(key.split(':')[0]) === column)
              .map(key => Number(key.split(':')[1]));
            const firstRow = column === 0 && occupiedRows.length > 0 ? Math.max(...occupiedRows) + 1 : 0;
            for (let row = firstRow; row <= maxRow; row += 1) {
              if (!occupied.has(`${column}:${row}`)) return { x: originX + column * cellSize, y: originY + row * cellSize };
            }
          }
        }
        for (let distance = 0; distance <= maxColumn + maxRow + 1; distance += 1) {
          for (let column = Math.max(0, requestedColumn - distance); column <= Math.min(maxColumn, requestedColumn + distance); column += 1) {
            for (let row = Math.max(0, requestedRow - distance); row <= Math.min(maxRow, requestedRow + distance); row += 1) {
              const key = `${column}:${row}`;
              if (!occupied.has(key)) return { x: originX + column * cellSize, y: originY + row * cellSize };
            }
          }
        }
        return { x: originX, y: originY };
      };

      const handleMouseMove = (e) => {
        if (draggingWin === 'sys-viewer') {
          const dx = e.clientX - dragStartPos.current.x;
          const dy = e.clientY - dragStartPos.current.y;
          setViewerState(prev => ({

            x: Math.max(0, dragStartPos.current.winX + dx),
            y: Math.max(0, dragStartPos.current.winY + dy)
          }));

            ...prev,

            ...(bounds.y === undefined ? {} : { y: bounds.y }),
            width: bounds.width,
            height: bounds.height
          }));
        } else if (draggingWin === 'sys-paint') {
          const dx = e.clientX - dragStartPos.current.x;
          const dy = e.clientY - dragStartPos.current.y;
          setPaintState(prev => ({
            ...prev,
            x: Math.max(0, dragStartPos.current.winX + dx),
            y: Math.max(0, dragStartPos.current.winY + dy)
          }));
        } else if (resizingWin === 'sys-paint') {
          const bounds = getResizedBounds(340, 240, e.clientX, e.clientY);
          setPaintState(prev => ({
            ...prev,
            ...(bounds.x === undefined ? {} : { x: bounds.x }),
            ...(bounds.y === undefined ? {} : { y: bounds.y }),
            width: bounds.width,

          }));

        } else if (resizingWin) {

            ...(bounds.x === undefined ? {} : { x: bounds.x }),
            ...(bounds.y === undefined ? {} : { y: bounds.y }),
            width: bounds.width,
            height: bounds.height
          });

          const dy = e.clientY - dragStartPos.current.y;

            y: Math.max(0, e.clientY - dragStartPos.current.grabOffsetY)
          });
        }
      };

      const handleMouseUp = () => {

              }

      const handlePhotoContextMenu = (e, photo, sourceWinId) => {

      const handleDesktopContextMenu = (e) => {
        e.preventDefault();

      const getDesktopIconEntries = (windows = data.windows) => [

      ];

      const getArrangedDesktopIcons = (entries, sortByName = false) => {
        const arrangedEntries = [...entries];
        if (sortByName) arrangedEntries.sort((left, right) => left.title.localeCompare(right.title));
        const desktopHeight = Math.max(DESKTOP_GRID.cellSize, window.innerHeight - 70);

      const userSections = data.windows.filter(w => w.type !== 'system');

      const winComp = data.windows.find(w => w.id === 'sys-computer');

      const selectedAdminWin = data.windows.find(w => w.id === selectedAdminWinId);
      const renderDesktopIconContent = (iconId) => {
        if (iconId === 'sys-computer') return <><ThemeComputerIcon theme={data.settings.osTheme} /><span>My Computer</span></>;

                  </span>
                  <div className="xp-controls">
                    <button onClick={(e) => { e.stopPropagation(); setPaintState(ps => ({ ...ps, isMinimized: true })); if (data.settings.enableSounds) playXpSound('click'); }}>_</button>
                    <button onClick={(e) => { e.stopPropagation(); setPaintState(ps => ({ ...ps, isMaximized: !ps.isMaximized })); if (data.settings.enableSounds) playXpSound('click'); }}>□</button>
                    <button className="close" onClick={(e) => { e.stopPropagation(); setPaintState(ps => ({ ...ps, isOpen: false })); if (data.settings.enableSounds) playXpSound('click'); }}>X</button>
                  </div>
                </div>

                <div className="flex justify-between items-center bg-[var(--xp-bg)] border-b">
                  <XpMenuBar 
                    winId="sys-paint" 
                    activeMenu={activeMenu} 
                    setActiveMenu={setActiveMenu} 
                    menuConfig={[
                      {
                        title: 'File',
                        items: [
                          {
                            icon: '💾',
                            label: 'Save / Download Drawing',
                            shortcut: 'Ctrl+S',
                            bold: true,
                            action: () => exportPaintImage(false)
                          },
                          {
                            icon: '🖼️',
                            label: 'Set as Desktop Background',
                            shortcut: 'Ctrl+W',
                            action: () => exportPaintImage(true)
                          },
                          {
                            icon: '🧹',
                            label: 'Clear Canvas',
                            action: handlePaintClear
                          },
                          { separator: true },
                          {
                            icon: '❌',
                            label: 'Exit Paint',
                            shortcut: 'Alt+F4',
                            action: () => setPaintState(ps => ({ ...ps, isOpen: false }))
                          }
                        ]
                      },
                      {
                        title: 'Edit',
                        items: [
                          {
                            icon: '↩️',
                            label: 'Undo',
                            shortcut: 'Ctrl+Z',
                            action: handlePaintUndo
                          },
                          {
                            icon: '↪️',
                            label: 'Redo',
                            shortcut: 'Ctrl+Y',
                            action: handlePaintRedo
                          },
                          {
                            icon: '🧹',
                            label: 'Clear All',
                            action: handlePaintClear
                          }
                        ]
                      },
                      {
                        title: 'Help',
                        items: [
                          {
                            icon: '🎨',
                            label: 'About MS Paint',
                            bold: true,
                            action: () => {
                              setDialogModal({
                                isOpen: true,
                                title: 'Microsoft Paint',
                                icon: '🎨',
                                message: 'Windows Paint graphics & image markup editor.',
                                details: 'Microsoft Windows XP Paint Subsystem\nBuild 2600.xpsp_sp3_gdr'
                              });
                            }
                          }
                        ]
                      }
                    ]} 
                  />
                </div>

                <div className="xp-content bg-[#808080] flex flex-1 relative overflow-hidden p-0">
                  {/* MS Paint Toolbar on Left */}
                  <div className="xp-paint-toolbar flex flex-col justify-between" onClick={(e) => e.stopPropagation()}>
                    <div className="space-y-2">
                      <div className="text-[9px] font-bold text-slate-700 text-center uppercase tracking-tighter border-b pb-0.5">Tools</div>
                      
                      {/* Tools Grid */}
                      <div className="grid grid-cols-2 gap-1">
                        {[
                          { id: 'pencil', icon: '✏️', title: 'Pencil (Freehand)' },
                          { id: 'brush', icon: '🖌️', title: 'Brush (Thick)' },
                          { id: 'line', icon: '📏', title: 'Straight Line' },
                          { id: 'rect', icon: '🔲', title: 'Rectangle' },
                          { id: 'circle', icon: '⭕', title: 'Circle / Oval' },
                          { id: 'arrow', icon: '➡️', title: 'Arrow Pointer' },
                          { id: 'text', icon: '🔤', title: 'Text Annotation' },
                          { id: 'eraser', icon: '🧹', title: 'Eraser' },
                        ].map(tool => (
                          <button
                            key={tool.id}
                            type="button"
                            title={tool.title}
                            onClick={() => {
                              setPaintState(ps => ({ ...ps, activeTool: tool.id }));
                              if (data.settings.enableSounds) playXpSound('click');
                            }}
                            className={`xp-paint-btn ${paintState.activeTool === tool.id ? 'active' : ''}`}
                          >
                            {tool.icon}
                          </button>
                        ))}
                      </div>

                      {/* Brush Width Selector */}
                      <div className="border-t pt-1.5 space-y-1">
                        <div className="text-[9px] text-slate-600 font-bold text-center">Width</div>
                        <div className="flex justify-center gap-1">
                          {[1, 3, 6, 12].map(sz => (
                            <button
                              key={`sz-${sz}`}
                              type="button"
                              onClick={() => setPaintState(ps => ({ ...ps, brushSize: sz }))}
                              className={`w-3.5 h-4 flex items-center justify-center border rounded ${paintState.brushSize === sz ? 'bg-blue-600 text-white font-bold border-blue-800' : 'bg-white text-slate-700'}`}
                            >
                              <div style={{ width: Math.min(8, sz + 1), height: Math.min(8, sz + 1), borderRadius: '50%', backgroundColor: 'currentColor' }} />
                            </button>
                          ))}
                        </div>
                      </div>

                      {/* Classic 16-Color Palette Grid */}
                      <div className="border-t pt-1.5 space-y-1">
                        <div className="text-[9px] text-slate-600 font-bold text-center">Color</div>
                        <div className="grid grid-cols-4 gap-1 place-items-center">
                          {[
                            '#000000', '#808080', '#800000', '#808000',
                            '#008000', '#008080', '#000080', '#800080',
                            '#ffffff', '#c0c0c0', '#ff0000', '#ffff00',
                            '#00ff00', '#00ffff', '#0000ff', '#ff00ff'
                          ].map(c => (
                            <div
                              key={c}
                              onClick={() => setPaintState(ps => ({ ...ps, brushColor: c }))}
                              className={`xp-color-swatch ${paintState.brushColor === c ? 'selected' : ''}`}
                              style={{ backgroundColor: c }}
                              title={c}
                            />
                          ))}
                        </div>
                        <div className="flex items-center justify-center pt-1">
                          <input
                            type="color"
                            value={paintState.brushColor}
                            onChange={(e) => setPaintState(ps => ({ ...ps, brushColor: e.target.value }))}
                            className="w-5 h-5 p-0 border cursor-pointer"
                            title="Custom Color Picker"
                          />
                        </div>
                      </div>
                    </div>

                    {/* Quick Undo / Redo / Clear */}
                    <div className="border-t pt-1 space-y-1">
                      <div className="flex gap-1 justify-center">
                        <button
                          type="button"
                          title="Undo (Ctrl+Z)"
                          onClick={handlePaintUndo}
                          className="xp-paint-btn"
                        >
                          ↩️
                        </button>
                        <button
                          type="button"
                          title="Redo (Ctrl+Y)"
                          onClick={handlePaintRedo}
                          className="xp-paint-btn"
                        >
                          ↪️
                        </button>
                      </div>
                      <button
                        type="button"
                        onClick={handlePaintClear}
                        className="w-full text-[9px] font-bold bg-white border border-slate-300 rounded py-0.5 hover:bg-red-50 hover:text-red-700"
                      >
                        Clear
                      </button>
                    </div>
                  </div>

                  {/* Paint Canvas Area */}
                  <div className="flex-1 flex items-center justify-center p-4 overflow-auto bg-slate-600 select-none">
                    <div className="relative bg-white shadow-2xl">
                      <canvas
                        ref={paintCanvasRef}
                        width={800}
                        height={600}
                        className="cursor-crosshair touch-none block"
                        onPointerDown={startPaint}
                        onPointerMove={doPaint}
                        onPointerUp={endPaint}
                        onMouseLeave={endPaint}
                      />
                    </div>
                  </div>
                </div>

                {!paintState.isMaximized && (
                  ['n', 'ne', 'e', 'se', 's', 'sw', 'w', 'nw'].map(direction => (
                    <div key={direction} className={`xp-resize-handle ${direction}`} onMouseDown={(e) => handlePaintResizeDown(e, direction)} title="Resize Window" />
                  ))
                )}
              </div>
            )}

            {}
            {contextMenu.visible && (
              <div 
                className="fixed bg-white border-2 border-slate-400 shadow-2xl py-1 text-xs z-[300000] w-52 font-sans select-none rounded-xs"
                style={{ top: contextMenu.y, left: contextMenu.x }}
                onClick={(e) => e.stopPropagation()}
              >
                {contextMenu.type === 'desktop' ? (
                  <>
                    <div className="px-3 py-1.5 hover:bg-blue-600 hover:text-white cursor-pointer font-bold" onClick={() => { addWindow('folder'); setContextMenu({ visible: false }); }}>📁 New Folder</div>
                    <div className="px-3 py-1.5 hover:bg-blue-600 hover:text-white cursor-pointer" onClick={() => { addWindow('txt'); setContextMenu({ visible: false }); }}>📝 New Text Document</div>
                    <div className="my-1 border-t" />
                    <div className="px-3 py-1.5 hover:bg-blue-600 hover:text-white cursor-pointer" onClick={() => arrangeDesktopIcons(true)}>🔤 Sort by Name</div>
                    <div className="px-3 py-1.5 hover:bg-blue-600 hover:text-white cursor-pointer" onClick={() => arrangeDesktopIcons(false)}>📐 Auto Arrange</div>
                    <div className="my-1 border-t" />
                    <div className="px-3 py-1.5 hover:bg-blue-600 hover:text-white cursor-pointer" onClick={() => { openWindow('sys-computer'); setMyComputerTab('admin'); setContextMenu({ visible: false }); }}>🔐 Admin CMS Access</div>
                  </>
                ) : contextMenu.type === 'icon' ? (
                  <div className="px-3 py-1.5 hover:bg-blue-600 hover:text-white cursor-pointer font-bold" onClick={() => sendToRecycleBin(contextMenu.sourceWinId)}>🗑️ Send to Recycle Bin</div>
                ) : contextMenu.photo && (
                  <>
                    <div className="px-3 py-1.5 hover:bg-blue-600 hover:text-white cursor-pointer font-bold" onClick={() => { setWallpaperForCurrentTheme(contextMenu.photo.url); setContextMenu({ visible: false }); }}>🖼️ Set as Desktop Background</div>
                    <div className="px-3 py-1.5 hover:bg-blue-600 hover:text-white cursor-pointer" onClick={() => {
                      const sourceWin = data.windows.find(w => w.id === contextMenu.sourceWinId);
                      const photos = sourceWin && sourceWin.photos && sourceWin.photos.length > 0 ? sourceWin.photos : [contextMenu.photo];
                      const photoIndex = Math.max(0, photos.findIndex(p => p.id === contextMenu.photo.id));
                      const title = sourceWin ? sourceWin.title : 'Photo Viewer';
                      openPhotoViewer(photos, photoIndex, title);
                      setContextMenu({ visible: false });
                    }}>🔍 Open in Photo Viewer</div>
                  </>
                )}
              </div>
            )}

            {/* XP Dialog Modal */}
            <XpDialogModal modal={dialogModal} onClose={() => setDialogModal(prev => ({ ...prev, isOpen: false }))} />

          </div>

          {}
          {isStartOpen && (
            <div className="start-menu" onClick={(e) => e.stopPropagation()}>
              <div className="start-menu-header">
                <div className="w-8 h-8 bg-white rounded flex items-center justify-center font-bold text-blue-600">OS</div>
                <span>{data.settings.username}</span>
              </div>
              <div className="start-menu-body">
                <div className="start-menu-left">
                  <div className="start-item font-bold" onClick={() => { openWindow('sys-computer'); setMyComputerTab('control'); setIsStartOpen(false); }}><ThemeComputerIcon theme={data.settings.osTheme} className="w-6 h-6" /> Control Panel</div>
                  <div className="start-item font-bold text-amber-800" onClick={() => { openWindow('sys-computer'); setMyComputerTab('admin'); setIsStartOpen(false); }}>🔐 Admin CMS Access</div>
                  <div className="my-1 border-t" />
                  {userSections.map(w => (
                    <div key={`start-${w.id}`} className="start-item" onClick={() => { openWindow(w.id); setIsStartOpen(false); }}>{w.type === 'txt' ? <ThemeNotepadIcon theme={data.settings.osTheme} className="w-6 h-6" /> : <ThemeFolderIcon theme={data.settings.osTheme} className="w-6 h-6" />} {w.title}</div>
                  ))}
                </div>
                <div className="start-menu-right">
                  <div className="start-item" onClick={() => { openWindow('sys-computer'); setMyComputerTab('control'); setIsStartOpen(false); }}><ThemeComputerIcon theme={data.settings.osTheme} className="w-6 h-6" /> My Computer</div>
                  <div className="start-item" onClick={() => { openPaint(); setIsStartOpen(false); }}><ThemePaintIcon className="w-6 h-6" /> Paint</div>
                  <div className="start-item" onClick={() => { openWindow('sys-recyclebin'); setIsStartOpen(false); }}><ThemeRecycleBinIcon theme={data.settings.osTheme} isFull={(data.recycleBin || []).length > 0} className="w-6 h-6" /> Recycle Bin</div>
                </div>
              </div>
              <div className="start-menu-footer">
                <button className="start-footer-btn" onClick={() => { setIsStartOpen(false); setShowShutdownModal(true); }}>🔴 Turn Off Computer</button>
              </div>
            </div>
          )}

          {}
          <div className="taskbar" onClick={(e) => e.stopPropagation()}>
            <button className="start-btn" onClick={() => setIsStartOpen(!isStartOpen)}>start</button>
            <div className="taskbar-items">
              {data.windows.filter(win => win.isOpen).map(win => (
                <div 
                  key={`task-${win.id}`} 
                  className={`taskbar-item ${!win.isMinimized && win.zIndex === highestZIndex && (!viewerState.isOpen || viewerState.isMinimized || viewerState.zIndex < win.zIndex) ? 'active' : ''}`}
                  onClick={() => { if (!win.isMinimized && win.zIndex === highestZIndex && viewerState.zIndex <= win.zIndex) toggleMinimize(win.id); else openWindow(win.id); }}
                >
                  <span className="truncate">{win.title}</span>
                </div>
              ))}
              {viewerState.isOpen && (
                <div 
                  className={`taskbar-item ${!viewerState.isMinimized && viewerState.zIndex === highestZIndex ? 'active' : ''}`}
                  onClick={() => {
                    if (!viewerState.isMinimized && viewerState.zIndex === highestZIndex) {
                      setViewerState(vs => ({ ...vs, isMinimized: true }));
                    } else {
                      bringViewerToFront();
                    }
                  }}
                >
                  <span className="truncate">🖼️ {viewerState.title || 'Photo Viewer'}</span>
                </div>
              )}
              {paintState.isOpen && (
                <div 
                  className={`taskbar-item ${!paintState.isMinimized && paintState.zIndex === highestZIndex ? 'active' : ''}`}
                  onClick={() => {
                    if (!paintState.isMinimized && paintState.zIndex === highestZIndex) {
                      setPaintState(ps => ({ ...ps, isMinimized: true }));
                    } else {
                      bringPaintToFront();
                    }
                  }}
                >
                  <span className="truncate">🎨 {paintState.title || 'Paint'}</span>
                </div>
              )}
            </div>
            <div className="system-tray">
              <span>{sysTime}</span>
            </div>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    // Start the interface immediately. The manifest effect fills the galleries
    // when GitHub or the local fallback responds, without delaying first paint.
    root.render(<App />);
  </script>
</body>
</html>
