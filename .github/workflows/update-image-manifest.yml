name: Update image manifest

on:
  push:
    paths:
      - 'images/**'
      - 'scripts/generate-image-manifest.mjs'
      - '.github/workflows/update-image-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate image manifest
        run: node scripts/generate-image-manifest.mjs

      - name: Commit updated manifest
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update image manifest'
          file_pattern: images.json
